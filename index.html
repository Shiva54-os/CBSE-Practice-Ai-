<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CBSE Class 10 Board Practice Hub</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 14px;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding-bottom: 90px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 20px;
    }
    .title {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .card {
      background: #141e33;
      border: 1px solid #23324d;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
    input[type="text"], select, textarea {
      width: 100%;
      background: #0b0f19;
      border: 1px solid #2a3b5c;
      border-radius: 12px;
      padding: 13px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }
    .btn:active { opacity: 0.9; transform: scale(0.99); }
    .chip {
      background: #0b0f19;
      border: 1px solid #2a3b5c;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 6px;
      margin-right: 6px;
      display: inline-block;
    }
    .chip:active { border-color: #38bdf8; color: #38bdf8; }
    .info-list {
      background: #0b0f19;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      color: #94a3b8;
      margin: 16px 0;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0b0f19;
      border: 1px solid #23324d;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .sticky-bar {
      position: sticky;
      top: 8px;
      z-index: 30;
      background: rgba(20, 30, 51, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #23324d;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .log-box {
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      text-align: left;
      margin: 16px 0;
      line-height: 1.8;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #38bdf8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Pre-loaded Core Engine (Zero external dependencies, guaranteed to run) -->
  <script>
    var examQuestions = [];
    var studentAnswers = {};
    var currentChapter = "";

    // Set topic chip
    function setTopic(topicName) {
      var input = document.getElementById("chapter-input");
      if (input) input.value = topicName;
    }

    // Call Google Gemini API
    async function queryGemini(apiKey, promptText) {
      var models = ["gemini-2.0-flash", "gemini-1.5-flash"];
      var lastError = "";

      for (var i = 0; i < models.length; i++) {
        var model = models[i];
        try {
          var url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(apiKey);
          var response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: {
                responseMimeType: "application/json",
                temperature: 0.5
              }
            })
          });

          var data = await response.json();
          if (data.candidates && data.candidates[0]) {
            var rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/gi, '').replace(/```/gi, '').trim();
            return JSON.parse(rawText);
          }
          if (data.error) {
            lastError = data.error.message;
          }
        } catch (err) {
          lastError = err.message;
        }
      }
      throw new Error(lastError || "Failed to reach AI servers. Please verify your internet and API key.");
    }

    // Main Generate Click Handler (Guaranteed to execute immediately)
    async function handleStartClick() {
      var btn = document.getElementById("start-btn");
      var chInput = document.getElementById("chapter-input");
      var diffSelect = document.getElementById("diff-select");
      var keyInput = document.getElementById("api-key-input");

      // 1. Instant visual feedback on button
      if (btn) {
        btn.disabled = true;
        btn.innerText = "⏳ Checking Key & Connecting...";
        btn.style.opacity = "0.75";
      }

      var chapter = chInput ? chInput.value.trim() : "";
      var difficulty = diffSelect ? diffSelect.value : "";
      var apiKey = keyInput ? keyInput.value.trim() : "";

      if (!chapter) {
        alert("Please enter a subject or chapter name.");
        if (btn) { btn.disabled = false; btn.innerText = "Generate Full Board Paper (43 Questions)"; btn.style.opacity = "1"; }
        return;
      }

      if (!apiKey) {
        alert("Please paste your Gemini API Key in the box above.");
        if (keyInput) keyInput.focus();
        if (btn) { btn.disabled = false; btn.innerText = "Generate Full Board Paper (43 Questions)"; btn.style.opacity = "1"; }
        return;
      }

      // Save key permanently in phone
      try { localStorage.setItem("my_cbse_key", apiKey); } catch(e){}
      currentChapter = chapter;

      // 2. Switch to Live Progress Screen
      var main = document.getElementById("app-view");
      main.innerHTML = `
        <div class="card" style="text-align: center; padding: 34px 20px;">
          <div class="spinner"></div>
          <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 10px;">Generating 43-Question CBSE Board Paper</h3>
          <div id="live-logger" class="log-box">Connecting to Gemini AI engine...</div>
        </div>
      `;

      var logger = document.getElementById("live-logger");
      function log(msg) {
        if (logger) logger.innerHTML += "<br/>" + msg;
      }

      try {
        var safeId = chapter.toLowerCase().replace(/[^a-z0-9]/g, "_");
        var excluded = [];
        try { excluded = JSON.parse(localStorage.getItem("hist_" + safeId) || "[]"); } catch(e){}

        // Stage 1: Objective Questions (20 Questions)
        log("▶ [1/2] Drafting Section A (15 MCQs) & Section B (5 AR)...");
        var prompt1 = `
CBSE Class 10 Board Examiner. Chapter: "${chapter}". Level: ${difficulty}. Avoid solved topics: ${JSON.stringify(excluded.slice(-20))}.
Generate 20 Objective Questions:
- 15 MCQs (Section A, id: 1 to 15, type: "MCQ", 4 options)
- 5 Assertion-Reason (Section B, id: 16 to 20, type: "ASSERTION_REASON", 4 options: ["Both A and R are true and R is correct explanation of A", "Both A and R are true but R is NOT correct explanation of A", "A is true but R is false", "A is false but R is true"])
Return strictly RAW JSON:
{"questions": [{"id": 1, "section": "Section A: Multiple Choice Questions (15 Marks)", "type": "MCQ", "question": "...", "options": ["A","B","C","D"], "correctAnswer": "...", "topicKeyword": "topic"}]}`;

        var resObj = await queryGemini(apiKey, prompt1);
        log("✓ Section A & B ready (" + (resObj.questions ? resObj.questions.length : 0) + " questions)!");

        // Stage 2: Subjective Questions (23 Questions)
        log("▶ [2/2] Drafting Section C (10 VSA), Section D (8 SA), Section E (5 LA)...");
        var prompt2 = `
CBSE Class 10 Board Examiner. Chapter: "${chapter}". Level: ${difficulty}. Avoid solved topics: ${JSON.stringify(excluded.slice(-20))}.
Generate 23 Subjective Questions:
- 10 Very Short Answer (Section C, id: 21 to 30, type: "VSA", 2 marks)
- 8 Short Answer (Section D, id: 31 to 38, type: "SA", 3 marks)
- 5 Long Answer (Section E, id: 39 to 43, type: "LA", 5 marks)
Return strictly RAW JSON:
{"questions": [{"id": 21, "section": "Section C: Very Short Answer Questions (20 Marks)", "type": "VSA", "question": "...", "options": null, "correctAnswer": "Key criteria points", "topicKeyword": "topic"}]}`;

        var resSub = await queryGemini(apiKey, prompt2);
        log("✓ Section C, D, E ready (" + (resSub.questions ? resSub.questions.length : 0) + " questions)!");

        examQuestions = (resObj.questions || []).concat(resSub.questions || []);
        studentAnswers = {};

        log("✓ Compiling final examination paper...");
        setTimeout(function() {
          renderTestPaper(chapter, safeId, apiKey);
        }, 400);

      } catch (err) {
        console.error(err);
        log("<span style='color:#f87171;'>❌ Error: " + err.message + "</span>");
        main.innerHTML += `
          <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
            <button class="btn" style="width:auto; padding:10px 20px;" onclick="location.reload()">Try Again</button>
          </div>
        `;
      }
    }

    function renderTestPaper(chapterTitle, safeId, apiKey) {
      var main = document.getElementById("app-view");
      var curSection = "";
      var questionsHtml = "";

      examQuestions.forEach(function(q, idx) {
        if (q.section && q.section !== curSection) {
          curSection = q.section;
          questionsHtml += `
            <div style="font-size: 13px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 24px 0 10px 0; border-bottom: 1px solid #1e293b; padding-bottom: 4px;">
              ${curSection}
            </div>
          `;
        }

        var inputMarkup = "";
        if (q.options && q.options.length > 0) {
          inputMarkup = `
            <div style="margin-top: 8px;">
              ${q.options.map(function(opt) {
                return `
                  <label class="option-row">
                    <input type="radio" name="q_${q.id}" value="${opt.replace(/"/g, '&quot;')}" onchange="recordAnswer(${q.id}, '${opt.replace(/'/g, "\\'")}')" />
                    <span>${opt}</span>
                  </label>
                `;
              }).join('')}
            </div>
          `;
        } else {
          var height = q.type === 'LA' ? '120px' : q.type === 'SA' ? '85px' : '65px';
          inputMarkup = `
            <div style="margin-top: 8px;">
              <textarea style="min-height: ${height};" placeholder="Write key points here..." oninput="recordAnswer(${q.id}, this.value)"></textarea>
            </div>
          `;
        }

        questionsHtml += `
          <div class="card" style="margin-bottom: 12px; padding: 16px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <span style="font-size: 11px; font-weight: 700; color: #38bdf8; background: #0b0f19; padding: 2px 8px; border-radius: 6px;">${q.type}</span>
              <span style="font-size: 11px; color: #64748b; font-family: monospace;">Q${idx + 1} / ${examQuestions.length}</span>
            </div>
            <p style="font-size: 14px; font-weight: 600; white-space: pre-line;">${q.question}</p>
            ${inputMarkup}
          </div>
        `;
      });

      main.innerHTML = `
        <div>
          <div class="sticky-bar">
            <div>
              <p style="font-size: 12px; font-weight: 700; color: #ffffff;">${chapterTitle}</p>
              <p id="ans-count" style="font-size: 11px; color: #38bdf8;">0 / ${examQuestions.length} Answered</p>
            </div>
            <button class="btn" style="width: auto; padding: 8px 16px; font-size: 12px; background: #059669;" onclick="submitEvaluation('${chapterTitle.replace(/'/g, "\\'")}', '${safeId}', '${apiKey}')">
              Submit Paper
            </button>
          </div>

          <div>${questionsHtml}</div>

          <button class="btn" style="margin-top: 16px; background: #059669;" onclick="submitEvaluation('${chapterTitle.replace(/'/g, "\\'")}', '${safeId}', '${apiKey}')">
            Submit Complete Paper & Evaluate
          </button>
        </div>
      `;
    }

    function recordAnswer(id, val) {
      studentAnswers[id] = val;
      var count = Object.values(studentAnswers).filter(function(v) { return v && v.trim && v.trim().length > 0; }).length;
      var el = document.getElementById("ans-count");
      if (el) el.innerText = count + " / " + examQuestions.length + " Answered";
    }

    async function submitEvaluation(chapterTitle, safeId, apiKey) {
      var main = document.getElementById("app-view");
      main.innerHTML = `
        <div class="card" style="text-align: center; padding: 40px 20px;">
          <div class="spinner" style="border-top-color: #059669;"></div>
          <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">AI Grading Your Exam Paper</h3>
          <p style="font-size: 12px; color: #94a3b8;">Evaluating answers as per CBSE Class 10 step-marking guidelines...</p>
        </div>
      `;

      try {
        var score = 0;
        var breakdown = [];
        var writtenList = [];

        examQuestions.forEach(function(q) {
          var ans = (studentAnswers[q.id] || "").trim();
          if (q.type === 'MCQ' || q.type === 'ASSERTION_REASON') {
            var isRight = ans.toLowerCase() === (q.correctAnswer || "").trim().toLowerCase();
            if (isRight) score += 1;
            breakdown.push({
              id: q.id,
              type: q.type,
              question: q.question,
              userAnswer: ans || "Not Answered",
              correctAnswer: q.correctAnswer,
              isCorrect: isRight,
              note: isRight ? "Correct answer selected." : "Incorrect choice."
            });
          } else {
            writtenList.push({
              id: q.id,
              type: q.type,
              question: q.question,
              userAnswer: ans,
              correctAnswer: q.correctAnswer
            });
          }
        });

        var evalPrompt = `
CBSE Board Examiner. Evaluate these subjective answers:
${JSON.stringify(writtenList)}
Return strictly RAW JSON:
{"summary": "Brief 2-line performance summary", "evaluations": [{"id": 21, "isCorrect": true, "note": "1-sentence note"}]}`;

        var aiEval = await queryGemini(apiKey, evalPrompt);
        var evalMap = {};
        (aiEval.evaluations || []).forEach(function(e) { evalMap[e.id] = e; });

        writtenList.forEach(function(sq) {
          var e = evalMap[sq.id] || { isCorrect: false, note: "Evaluated." };
          if (e.isCorrect) score += 1;
          breakdown.push({
            id: sq.id,
            type: sq.type,
            question: sq.question,
            userAnswer: sq.userAnswer || "Not Answered",
            correctAnswer: sq.correctAnswer,
            isCorrect: e.isCorrect,
            note: e.note
          });
        });

        breakdown.sort(function(a, b) { return a.id - b.id; });
        var total = examQuestions.length;
        var percentage = Math.round((score / total) * 100);

        // Anti-repetition save
        try {
          var newTopics = examQuestions.map(function(q) { return q.topicKeyword || q.question.substring(0, 30); });
          var existing = JSON.parse(localStorage.getItem("hist_" + safeId) || "[]");
          existing = existing.concat(newTopics);
          localStorage.setItem("hist_" + safeId, JSON.stringify(existing));
        } catch(e) {}

        renderFinalScore(score, total, percentage, aiEval.summary || "Practice session complete. Review your marks below.", breakdown);

      } catch (err) {
        console.error(err);
        alert("Evaluation took too long. Returning to home.");
        location.reload();
      }
    }

    function renderFinalScore(score, total, percentage, summary, breakdown) {
      var main = document.getElementById("app-view");
      var breakdownHtml = breakdown.map(function(b) {
        return `
          <div class="card" style="padding: 14px; margin-bottom: 10px; border-color: ${b.isCorrect ? '#065f46' : '#991b1b'};">
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px;">
              <span style="font-weight: 700; color: ${b.isCorrect ? '#34d399' : '#f87171'};">
                ${b.isCorrect ? '✓ Correct / Key Points Met' : '✕ Needs Improvement'}
              </span>
              <span style="color: #64748b; font-family: monospace;">${b.type}</span>
            </div>
            <p style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">${b.question}</p>
            <div style="font-size: 12px; color: #94a3b8; display: flex; flex-direction: column; gap: 3px;">
              <p><strong style="color: #cbd5e1;">Your Answer:</strong> ${b.userAnswer}</p>
              <p><strong style="color: #cbd5e1;">Model Answer:</strong> ${b.correctAnswer}</p>
              ${b.note ? `<p style="color: #fcd34d;"><strong>Examiner Note:</strong> ${b.note}</p>` : ''}
            </div>
          </div>
        `;
      }).join('');

      main.innerHTML = `
        <div>
          <div class="card" style="text-align: center; padding: 24px;">
            <h2 style="font-size: 36px; font-weight: 800; color: #38bdf8;">${score} / ${total}</h2>
            <p style="font-size: 14px; font-weight: 700; margin-top: 4px;">Score: ${percentage}%</p>
            <p style="font-size: 12px; color: #94a3b8; margin: 10px auto 0 auto; max-width: 480px;">${summary}</p>
            <button class="btn" style="margin-top: 16px; width: auto; padding: 10px 20px;" onclick="location.reload()">
              Practice Another Chapter / Next Set
            </button>
          </div>

          <h3 style="font-size: 13px; font-weight: 700; color: #cbd5e1; margin: 18px 0 10px 0;">Detailed Step Breakdown & Mistakes</h3>
          <div>${breakdownHtml}</div>
        </div>
      `;
    }

    // Auto-fill saved key on load
    window.addEventListener("DOMContentLoaded", function() {
      try {
        var saved = localStorage.getItem("my_cbse_key");
        var input = document.getElementById("api-key-input");
        if (saved && input) input.value = saved;
      } catch(e){}
    });
  </script>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 class="title">CBSE Board Practice Hub</h1>
        <p style="font-size: 11px; color: #64748b;">Class 10 Smart Mock
