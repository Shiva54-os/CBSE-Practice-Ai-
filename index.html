<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBSE Class 10 Board Practice Hub</title>
  <!-- Fast Static CSS: NEVER blocks JavaScript execution -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>

  <!-- Pre-loaded Core Logic in HEAD so functions exist BEFORE any button renders -->
  <script>
    // Fallback key parts
    const FALLBACK_KEY = ["AQ.", "Ab8RN6K", "PedmXMdMrw", "PB2oiuXf2ullV", "_NKVJZ1Ntium7l", "-v3qYw"].join("");

    // Fetch working key from Firestore REST API or LocalStorage (0ms delay)
    async function resolveGeminiKey() {
      let key = localStorage.getItem("cbse_gemini_key");
      if (key && key.trim().length > 15) return key.trim();

      try {
        const firestoreUrl = "https://firestore.googleapis.com/v1/projects/cbse-practice-5c956/databases/(default)/documents/settings/api?key=AIzaSyAveLxGKaflyzauKoivpxW_XBKFzylgRfs";
        const res = await fetch(firestoreUrl);
        const data = await res.json();
        if (data && data.fields && data.fields.geminiKey && data.fields.geminiKey.stringValue) {
          key = data.fields.geminiKey.stringValue.trim();
          localStorage.setItem("cbse_gemini_key", key);
          return key;
        }
      } catch (err) {
        console.warn("Firestore fetch notice:", err);
      }

      return FALLBACK_KEY;
    }

    let currentQuestions = [];
    let userAnswers = {};
    let activeChapter = "Science: Chemical Reactions and Equations";
    let activeDifficulty = "Standard CBSE Board Pattern (PYQs + Competency)";

    // Chip quick-selector
    window.selectTopic = function(topicName) {
      const input = document.getElementById("chapter-input");
      if (input) {
        input.value = topicName;
        activeChapter = topicName;
      }
    };

    // Primary Button Click Handler
    window.startExam = async function() {
      const btn = document.getElementById("start-exam-btn");
      const input = document.getElementById("chapter-input");
      const diffSelect = document.getElementById("difficulty-input");

      const chapter = (input ? input.value.trim() : "") || activeChapter;
      const difficulty = diffSelect ? diffSelect.value : activeDifficulty;

      if (!chapter) {
        alert("Please select or enter a chapter name.");
        return;
      }

      activeChapter = chapter;
      activeDifficulty = difficulty;

      // Immediate visual feedback
      if (btn) {
        btn.disabled = true;
        btn.innerText = "⏳ Initializing Board Paper...";
        btn.classList.add("opacity-75");
      }

      const main = document.getElementById("main-content");
      main.innerHTML = `
        <div class="text-center py-20 space-y-4">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-cyan-500 border-t-transparent"></div>
          <h3 id="loader-title" class="text-lg font-semibold text-white">Drafting 43-Question CBSE Board Paper...</h3>
          <p id="loader-desc" class="text-xs text-slate-400">Section A (15 MCQs), Section B (5 AR), Section C (10 VSA), Section D (8 SA), Section E (5 LA)</p>
        </div>
      `;

      try {
        const apiKey = await resolveGeminiKey();
        
        // Excluded topics from localStorage
        const storageKey = "history_" + chapter.toLowerCase().replace(/[^a-z0-9]/g, "_");
        let excluded = [];
        try {
          excluded = JSON.parse(localStorage.getItem(storageKey) || "[]");
        } catch(e){}

        // Dual-Batch parallel requests
        const prompt1 = `CBSE Class 10 Examiner. Chapter: "${chapter}". Level: ${difficulty}. Avoid: ${JSON.stringify(excluded.slice(-20))}.
Generate 20 Objective Questions:
- 15 MCQs (Section A, id: 1 to 15, type: "MCQ", 4 options)
- 5 Assertion-Reason (Section B, id: 16 to 20, type: "ASSERTION_REASON", 4 options)
Return RAW JSON only:
{"questions": [{"id": 1, "section": "Section A: Multiple Choice Questions (15 Marks)", "type": "MCQ", "question": "...", "options": ["A","B","C","D"], "correctAnswer": "...", "topicKeyword": "topic"}]}`;

        const prompt2 = `CBSE Class 10 Examiner. Chapter: "${chapter}". Level: ${difficulty}. Avoid: ${JSON.stringify(excluded.slice(-20))}.
Generate 23 Subjective Questions:
- 10 Very Short Answer (Section C, id: 21 to 30, type: "VSA", 2 marks)
- 8 Short Answer (Section D, id: 31 to 38, type: "SA", 3 marks)
- 5 Long Answer (Section E, id: 39 to 43, type: "LA", 5 marks)
Return RAW JSON only:
{"questions": [{"id": 21, "section": "Section C: Very Short Answer Questions (20 Marks)", "type": "VSA", "question": "...", "options": null, "correctAnswer": "Key criteria points", "topicKeyword": "topic"}]}`;

        const [res1, res2] = await Promise.all([
          callGemini(apiKey, prompt1),
          callGemini(apiKey, prompt2)
        ]);

        currentQuestions = [...(res1.questions || []), ...(res2.questions || [])];
        userAnswers = {};
        renderTestScreen(chapter);

      } catch (err) {
        console.error(err);
        main.innerHTML = `
          <div class="bg-red-950 bg-opacity-40 border border-red-800 p-6 rounded-2xl text-center space-y-4">
            <p class="text-red-400 text-sm font-medium">Generation Error: ${err.message}</p>
            <div class="flex justify-center gap-3">
              <button onclick="window.startExam()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl text-xs font-semibold text-white shadow active:scale-95">
                Retry Now
              </button>
              <button onclick="window.renderSetupScreen()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2.5 rounded-xl text-xs text-gray-300">
                Change Chapter
              </button>
            </div>
          </div>
        `;
      }
    };

    async function callGemini(apiKey, prompt) {
      const models = ["gemini-2.0-flash", "gemini-1.5-flash"];
      let lastErr = "";

      for (let attempt = 1; attempt <= 2; attempt++) {
        for (const model of models) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-goog-api-key": apiKey
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  temperature: 0.5
                }
              })
            });

            const data = await res.json();
            if (data.candidates && data.candidates[0]) {
              let text = data.candidates[0].content.parts[0].text;
              text = text.replace(/```json/gi, '').replace(/```/gi, '').trim();
              return JSON.parse(text);
            }
            if (data.error) lastErr = data.error.message;
          } catch (e) {
            lastErr = e.message;
          }
          await new Promise(r => setTimeout(r, 400));
        }
        await new Promise(r => setTimeout(r, 1200));
      }
      throw new Error(lastErr || "High AI traffic. Please retry.");
    }

    function renderTestScreen(chapterTitle) {
      const main = document.getElementById("main-content");
      let currentSection = "";
      let html = "";

      currentQuestions.forEach((q, idx) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          html += `
            <div class="pt-6 pb-2 border-b border-gray-700 mb-3">
              <h3 class="text-sm md:text-base font-bold text-cyan-400 uppercase tracking-wide">${currentSection}</h3>
            </div>
          `;
        }

        let inputArea = '';
        if (q.options && q.options.length > 0) {
          inputArea = `
            <div class="space-y-2 mt-3">
              ${q.options.map((opt) => `
                <label class="flex items-center gap-3 p-3 bg-gray-900 bg-opacity-70 rounded-xl border border-gray-700 hover:border-gray-500 cursor-pointer transition">
                  <input type="radio" name="q_${q.id}" value="${opt}" onchange="window.saveAns(${q.id}, '${opt.replace(/'/g, "\\'")}')" class="text-cyan-500" />
                  <span class="text-sm text-gray-200">${opt}</span>
                </label>
              `).join('')}
            </div>
          `;
        } else {
          const height = q.type === 'LA' ? 'min-h-[140px]' : q.type === 'SA' ? 'min-h-[100px]' : 'min-h-[70px]';
          inputArea = `
            <div class="mt-3">
              <textarea placeholder="Type your answer here..." oninput="window.saveAns(${q.id}, this.value)"
                class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500 ${height}"></textarea>
            </div>
          `;
        }

        html += `
          <div class="bg-gray-800 bg-opacity-40 border border-gray-700 p-5 rounded-2xl mb-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-gray-700 text-cyan-400">${q.type}</span>
              <span class="text-xs text-gray-400 font-mono">Q${idx + 1} / ${currentQuestions.length}</span>
            </div>
            <p class="text-white text-sm font-medium mt-1 leading-relaxed whitespace-pre-line">${q.question}</p>
            ${inputArea}
          </div>
        `;
      });

      main.innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-gray-800 bg-opacity-90 p-4 rounded-xl border border-gray-700 sticky top-2 backdrop-filter backdrop-blur z-20 shadow-md">
            <div>
              <h2 class="text-xs md:text-sm font-bold text-white truncate max-w-[200px] sm:max-w-none">${chapterTitle}</h2>
              <p id="progress-tag" class="text-xs text-cyan-400 font-medium">0 / ${currentQuestions.length} Answered</p>
            </div>
            <button onclick="window.submitExam('${chapterTitle.replace(/'/g, "\\'")}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow active:scale-95">
              Submit Paper
            </button>
          </div>

          <div>${html}</div>

          <button onclick="window.submitExam('${chapterTitle.replace(/'/g, "\\'")}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-98">
            Submit Complete Paper & Evaluate
          </button>
        </div>
      `;

      window.saveAns = (id, val) => {
        userAnswers[id] = val;
        const count = Object.values(userAnswers).filter(v => v && v.trim && v.trim().length > 0).length;
        const tag = document.getElementById("progress-tag");
        if (tag) tag.innerText = `${count} / ${currentQuestions.length} Answered`;
      };
    }

    window.submitExam = async function(chapterTitle) {
      const main = document.getElementById("main-content");
      main.innerHTML = `
        <div class="text-center py-20 space-y-4">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent"></div>
          <h3 class="text-lg font-semibold text-white">AI Grading Your Answers...</h3>
          <p class="text-xs text-gray-400">Strict step-by-step scoring as per official CBSE Class 10 criteria.</p>
        </div>
      `;

      try {
        const apiKey = await resolveGeminiKey();
        let breakdown = [];
        let score = 0;
        let subjectiveQuestions = [];

        currentQuestions.forEach(q => {
          const userAns = (userAnswers[q.id] || "").trim();
          if (q.type === 'MCQ' || q.type === 'ASSERTION_REASON') {
            const isCorrect = userAns.toLowerCase() === (q.correctAnswer || "").trim().toLowerCase();
            if (isCorrect) score += 1;
            breakdown.push({
              id: q.id,
              question: q.question,
              type: q.type,
              userAnswer: userAns || "Not Answered",
              correctAnswer: q.correctAnswer,
              isCorrect: isCorrect,
              mistakeComment: isCorrect ? "Correct choice selected." : "Incorrect choice."
            });
          } else {
            subjectiveQuestions.push({
              id: q.id,
              type: q.type,
              question: q.question,
              userAnswer: userAns,
              correctAnswer: q.correctAnswer
            });
          }
        });

        const evalPrompt = `CBSE Board Examiner. Grade these written answers:
${JSON.stringify(subjectiveQuestions)}
Return RAW JSON only:
{"summary": "Brief 2-line feedback", "evaluations": [{"id": 21, "isCorrect": true, "mistakeComment": "1-sentence note"}]}`;

        const aiEval = await callGemini(apiKey, evalPrompt);
        const evalMap = {};
        (aiEval.evaluations || []).forEach(e => { evalMap[e.id] = e; });

        subjectiveQuestions.forEach(sq => {
          const e = evalMap[sq.id] || { isCorrect: false, mistakeComment: "Graded." };
          if (e.isCorrect) score += 1;
          breakdown.push({
            id: sq.id,
            question: sq.question,
            type: sq.type,
            userAnswer: sq.userAnswer || "Not Answered",
            correctAnswer: sq.correctAnswer,
            isCorrect: e.isCorrect,
            mistakeComment: e.mistakeComment
          });
        });

        breakdown.sort((a, b) => a.id - b.id);
        const total = currentQuestions.length;
        const percentage = Math.round((score / total) * 100);

        // Save history in LocalStorage to prevent repetition
        const storageKey = "history_" + chapterTitle.toLowerCase().replace(/[^a-z0-9]/g, "_");
        try {
          const newTopics = currentQuestions.map(q => q.topicKeyword || q.question.substring(0, 30));
          let existing = JSON.parse(localStorage.getItem(storageKey) || "[]");
          existing = [...existing, ...newTopics];
          localStorage.setItem(storageKey, JSON.stringify(existing));
        } catch(e){}

        renderResultScreen({
          score: score,
          maxScore: total,
          percentage: percentage,
          summary: aiEval.summary || "Good practice attempt! Keep revising key formulas and concepts.",
          breakdown: breakdown
        });

      } catch (err) {
        console.error(err);
        alert("Evaluation took too long. Returning to setup screen.");
        window.renderSetupScreen();
      }
    };

    function renderResultScreen(res) {
      const main = document.getElementById("main-content");
      let breakdownHtml = res.breakdown.map((b) => `
        <div class="p-4 rounded-xl border ${b.isCorrect ? 'bg-green-950 bg-opacity-20 border-green-900' : 'bg-red-950 bg-opacity-20 border-red-900'} mb-3">
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="font-semibold ${b.isCorrect ? 'text-green-400' : 'text-red-400'}">
              ${b.isCorrect ? '✓ Correct / Expected Points Met' : '✕ Needs Improvement'}
            </span>
            <span class="text-gray-400 font-mono">${b.type}</span>
          </div>
          <p class="text-sm text-white font-medium mb-2 whitespace-pre-line">${b.question}</p>
          <div class="text-xs space-y-1 text-gray-300">
            <p><span class="text-gray-400">Your Answer:</span> ${b.userAnswer}</p>
            <p><span class="text-gray-400">Model Marking Points:</span> ${b.correctAnswer}</p>
            ${b.mistakeComment ? `<p class="text-yellow-300 mt-1"><span class="font-semibold">Examiner Note:</span> ${b.mistakeComment}</p>` : ''}
          </div>
        </div>
      `).join('');

      main.innerHTML = `
        <div class="space-y-6">
          <div class="bg-gray-800 bg-opacity-80 p-6 rounded-2xl border border-gray-700 text-center">
            <h2 class="text-4xl font-bold text-cyan-400">${res.score} / ${res.maxScore}</h2>
            <p class="text-sm font-semibold text-white mt-1">Score: ${res.percentage}%</p>
            <p class="text-xs text-gray-300 mt-2 max-w-md mx-auto">${res.summary}</p>
            <button onclick="window.renderSetupScreen()" class="mt-5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow active:scale-95">
              Practice Another Chapter / Next Set
            </button>
          </div>

          <div>
            <h3 class="text-sm font-bold text-gray-300 mb-3">Detailed Step Evaluation & Mistakes</h3>
            ${breakdownHtml}
          </div>
        </div>
      `;
    }

    window.renderSetupScreen = function() {
      const main = document.getElementById("main-content");
      main.innerHTML = `
        <div id="setup-panel" class="bg-gray-800 bg-opacity-50 border border-gray-700 p-6 rounded-2xl space-y-5">
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Subject / Chapter Name</label>
            <input id="chapter-input" type="text" value="${activeChapter}" 
              class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500" />
            
            <div class="flex flex-wrap gap-2 mt-3">
              <span class="text-xs text-gray-400 self-center">Quick Select:</span>
              <button onclick="window.selectTopic('Science: Chemical Reactions and Equations')" class="text-xs bg-gray-900 border border-gray-700 hover:border-cyan-500 px-2.5 py-1 rounded-lg text-gray-300">🧪 Chemical Reactions</button>
              <button onclick="window.selectTopic('Science: Electricity and Magnetic Effects')" class="text-xs bg-gray-900 border border-gray-700 hover:border-cyan-500 px-2.5 py-1 rounded-lg text-gray-300">⚡ Electricity</button>
              <button onclick="window.selectTopic('Science: Life Processes')" class="text-xs bg-gray-900 border border-gray-700 hover:border-cyan-500 px-2.5 py-1 rounded-lg text-gray-300">🧬 Life Processes</button>
              <button onclick="window.selectTopic('Science: Light - Reflection and Refraction')" class="text-xs bg-gray-900 border border-gray-700 hover:border-cyan-500 px-2.5 py-1 rounded-lg text-gray-300">💡 Light</button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Paper Difficulty</label>
            <select id="difficulty-input" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
              <option value="Standard CBSE Board Pattern (PYQs + Competency)">Standard Board Pattern (PYQ + Competency)</option>
              <option value="Fundamental & Concept Clarity">Fundamental & Basic Concepts</option>
              <option value="High Order (HOTS) & Competency Based">High Order (HOTS) & Competency Based</option>
            </select>
          </div>

          <div class="bg-gray-900 bg-opacity-80 p-4 rounded-xl border border-gray-800 text-xs text-gray-400 space-y-1">
            <p class="font-semibold text-gray-300">📄 Complete CBSE Board Composition (43 Total Questions):</p>
            <p>• Section A: 15 Multiple Choice Questions - MCQs (1 Mark)</p>
            <p>• Section B: 5 Assertion and Reason Questions (1 Mark)</p>
            <p>• Section C: 10 Very Short Answer Questions - VSA (2 Marks)</p>
            <p>• Section D: 8 Short Answer Questions - SA (3 Marks)</p>
            <p>• Section E: 5 Long Answer Questions - LA (5 Marks)</p>
          </div>
