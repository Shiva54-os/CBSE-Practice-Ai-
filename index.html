    // Fast AI caller with progressive auto-retry
    async function callGemini(prompt, updateStatus) {
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
      const delays = [1500, 3000, 4500];
      let lastErrorMessage = "";

      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          if (updateStatus) {
            updateStatus(attempt === 1 
              ? "Drafting 43-Question CBSE Board Paper..." 
              : `AI server busy, auto-reconnecting... (Attempt ${attempt}/3)`
            );
          }

          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-goog-api-key": GEMINI_API_KEY
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { 
                responseMimeType: "application/json",
                temperature: 0.5
              }
            })
          });

          const data = await res.json();
          if (data.candidates && data.candidates[0]) {
            return data;
          }

          if (data.error) {
            lastErrorMessage = data.error.message;
            console.warn(`Attempt ${attempt} error:`, data.error.message);
          }
        } catch (err) {
          lastErrorMessage = err.message;
          console.warn(`Network error attempt ${attempt}:`, err);
        }

        await new Promise(r => setTimeout(r, delays[attempt - 1] || 2000));
      }

      throw new Error(lastErrorMessage || "Server is experiencing high demand. Please try again.");
    }
