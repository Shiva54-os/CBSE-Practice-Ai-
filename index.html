<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBSE Class 10 Practice Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="app" class="max-w-3xl mx-auto p-4 md:p-6 pb-24">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
      <div>
        <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
          CBSE Board Practice Hub
        </h1>
        <p class="text-xs text-slate-400">Class 10 Smart Revision & Non-Repetition System</p>
      </div>
      <div id="auth-container"></div>
    </header>

    <!-- Main Dynamic Area -->
    <main id="main-content">
      <div class="text-center py-16">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-cyan-500 border-t-transparent"></div>
        <p class="text-slate-400 text-xs mt-3">Connecting to system...</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replaced Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAveLxGKaflyzauKoivpxW_XBKFzylgRfs",
      authDomain: "cbse-practice-5c956.firebaseapp.com",
      projectId: "cbse-practice-5c956",
      storageBucket: "cbse-practice-5c956.firebasestorage.app",
      messagingSenderId: "264196286802",
      appId: "1:264196286802:web:e4485efa3e2720559bf28b"
    };

    // Replaced Gemini Key
    const GEMINI_API_KEY = "AQ.Ab8RN6K_D7J9J_b8E5PWBmdaEvvhYUzHpG3fF_NQ2kX8rTrPbg";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentQuestions = [];
    let userAnswers = {};

    const authContainer = document.getElementById("auth-container");
    const mainContent = document.getElementById("main-content");

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      renderAuthButton();
      if (user) {
        renderSetupScreen();
      } else {
        renderLoginPrompt();
      }
    });

    function renderAuthButton() {
      if (currentUser) {
        authContainer.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-300 font-medium hidden sm:inline">${currentUser.displayName || 'Student'}</span>
            <button id="logout-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
              Logout
            </button>
          </div>
        `;
        document.getElementById("logout-btn").onclick = () => signOut(auth);
      } else {
        authContainer.innerHTML = `
          <button id="login-btn" class="bg-blue-600 hover:bg-blue-500 text-xs font-semibold px-4 py-2 rounded-lg text-white">
            Google Sign-In
          </button>
        `;
        document.getElementById("login-btn").onclick = () => signInWithPopup(auth, provider);
      }
    }

    function renderLoginPrompt() {
      mainContent.innerHTML = `
        <div class="bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl text-center my-12 backdrop-blur">
          <h2 class="text-2xl font-bold mb-3 text-white">Target 95%+ in Class 10 Boards</h2>
          <p class="text-slate-400 text-sm max-w-md mx-auto mb-6">
            Log in to practice fresh CBSE questions (MCQ, Assertion-Reason, Short & Long Answers). Your solved questions are tracked individually to prevent repeats.
          </p>
          <button id="hero-login-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-blue-500/20">
            Sign In with Google to Start Practice
          </button>
        </div>
      `;
      document.getElementById("hero-login-btn").onclick = () => signInWithPopup(auth, provider);
    }

    function renderSetupScreen() {
      mainContent.innerHTML = `
        <div class="bg-slate-800/40 border border-slate-700/80 p-6 rounded-2xl space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">Subject / Chapter Name</label>
            <input id="chapter-input" type="text" placeholder="e.g. Science: Chemical Reactions and Equations" 
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">Difficulty Level</label>
            <select id="difficulty-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
              <option value="Standard Board Pattern (80% Board PYQs + 20% Fundamental Basics)">Standard Board Pattern (80% Exam + 20% Basics)</option>
              <option value="Fundamental & Concept Clear (Basic Only)">Fundamental & Basic Questions Only</option>
              <option value="Competency Based & High Order (HOTS)">High Order (HOTS) & Competency Based</option>
            </select>
          </div>

          <button id="start-btn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/10">
            Start Practice
          </button>
        </div>
      `;

      document.getElementById("start-btn").onclick = handleStartPractice;
    }

    async function handleStartPractice() {
      const chapter = document.getElementById("chapter-input").value.trim();
      const difficulty = document.getElementById("difficulty-input").value;

      if (!chapter) {
        alert("Please enter a chapter name");
        return;
      }

      mainContent.innerHTML = `
        <div class="text-center py-20 space-y-4">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-cyan-500 border-t-transparent"></div>
          <h3 class="text-lg font-semibold text-white">Generating CBSE Exam Questions...</h3>
          <p class="text-xs text-slate-400">Verifying past questions from your account to avoid repetition.</p>
        </div>
      `;

      try {
        const safeChapterId = chapter.toLowerCase().replace(/[^a-z0-9]/g, "_");
        const historyRef = doc(db, "users", currentUser.uid, "history", safeChapterId);
        const historySnap = await getDoc(historyRef);
        const excludedTopics = historySnap.exists() ? historySnap.data().topics || [] : [];

        const prompt = `
You are a senior CBSE Class 10 Board Examiner. Create a comprehensive practice test for Chapter: "${chapter}".
Difficulty Level: ${difficulty}.
CRITICAL NON-REPEAT RULE: DO NOT repeat these topics/questions already solved by this user: ${JSON.stringify(excludedTopics.slice(-30))}.

Generate a mixed paper with:
- 10 Multiple Choice Questions (MCQ)
- 2 Assertion-Reason Questions
- 2 True/False Questions
- 2 One-Word Answer Questions
- 2 Very Short Answers (VSA)
- 2 Short Answers (SA)
- 1 Long Answer (LA)

Return STRICTLY raw JSON (without backticks or extra words):
{
  "title": "${chapter}",
  "questions": [
    {
      "id": 1,
      "type": "MCQ", 
      "question": "Question text",
      "options": ["A", "B", "C", "D"],
      "correctAnswer": "A",
      "topicKeyword": "Topic summary"
    },
    {
      "id": 2,
      "type": "ASSERTION_REASON",
      "question": "Assertion (A): ... Reason (R): ...",
      "options": [
        "Both A and R are true and R is the correct explanation of A",
        "Both A and R are true but R is NOT the correct explanation of A",
        "A is true but R is false",
        "A is false but R is true"
      ],
      "correctAnswer": "Both A and R are true and R is the correct explanation of A",
      "topicKeyword": "Topic summary"
    },
    {
      "id": 3,
      "type": "TRUE_FALSE",
      "question": "Statement",
      "options": ["True", "False"],
      "correctAnswer": "True",
      "topicKeyword": "Topic summary"
    },
    {
      "id": 4,
      "type": "ONE_WORD",
      "question": "One word question text",
      "options": null,
      "correctAnswer": "Ideal term",
      "topicKeyword": "Topic summary"
    },
    {
      "id": 5,
      "type": "VSA",
      "question": "Very Short Answer Question (2 marks)",
      "options": null,
      "correctAnswer": "Key points expected",
      "topicKeyword": "Topic summary"
    },
    {
      "id": 6,
      "type": "SA",
      "question": "Short Answer Question (3 marks)",
      "options": null,
      "correctAnswer": "Key points expected",
      "topicKeyword": "Topic summary"
    },
    {
      "id": 7,
      "type": "LA",
      "question": "Long Answer Question (5 marks)",
      "options": null,
      "correctAnswer": "Comprehensive marking points",
      "topicKeyword": "Topic summary"
    }
  ]
}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const resData = await response.json();
        if (!resData.candidates || !resData.candidates[0]) {
          throw new Error(resData.error?.message || "Invalid response from Gemini API");
        }

        let jsonText = resData.candidates[0].content.parts[0].text;
        jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(jsonText);

        currentQuestions = parsed.questions;
        userAnswers = {};
        renderTestScreen(chapter, safeChapterId);

      } catch (err) {
        console.error(err);
        mainContent.innerHTML = `
          <div class="bg-red-950/40 border border-red-800 p-6 rounded-2xl text-center space-y-4">
            <p class="text-red-400 text-sm font-medium">Failed to generate test: ${err.message}</p>
            <p class="text-xs text-slate-400">If API key error occurs, ensure your Gemini key starts with AIzaSy.</p>
            <button onclick="location.reload()" class="bg-slate-800 px-4 py-2 rounded-lg text-xs text-white">Try Again</button>
          </div>
        `;
      }
    }

    function renderTestScreen(chapterTitle, safeChapterId) {
      let questionsHtml = currentQuestions.map((q, idx) => {
        let inputArea = '';

        if (q.options && q.options.length > 0) {
          inputArea = `
            <div class="space-y-2 mt-3">
              ${q.options.map((opt) => `
                <label class="flex items-center gap-3 p-3 bg-slate-900/70 rounded-xl border border-slate-700/60 hover:border-slate-500 cursor-pointer transition">
                  <input type="radio" name="q_${q.id}" value="${opt}" onchange="window.saveAnswer(${q.id}, '${opt.replace(/'/g, "\\'")}')" class="text-cyan-500" />
                  <span class="text-sm text-slate-200">${opt}</span>
                </label>
              `).join('')}
            </div>
          `;
        } else {
          inputArea = `
            <div class="mt-3">
              <textarea placeholder="Type your answer here..." oninput="window.saveAnswer(${q.id}, this.value)"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500 min-h-[90px]"></textarea>
            </div>
          `;
        }

        return `
          <div class="bg-slate-800/40 border border-slate-700/60 p-5 rounded-2xl">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2 py-1 rounded bg-slate-700 text-cyan-400">${q.type.replace('_', ' ')}</span>
              <span class="text-xs text-slate-400 font-mono">Q${idx + 1} / ${currentQuestions.length}</span>
            </div>
            <p class="text-white text-sm font-medium mt-1 leading-relaxed">${q.question}</p>
            ${inputArea}
          </div>
        `;
      }).join('');

      mainContent.innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-slate-800/80 p-4 rounded-xl border border-slate-700 sticky top-2 backdrop-blur z-10">
            <div>
              <h2 class="text-sm md:text-base font-bold text-white">${chapterTitle}</h2>
              <p class="text-xs text-slate-400">${currentQuestions.length} Questions</p>
            </div>
            <button id="top-submit-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow">
              Submit
            </button>
          </div>

          <div class="space-y-4">
            ${questionsHtml}
          </div>

          <button id="bottom-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg">
            Submit Test & Evaluate Mistakes
          </button>
        </div>
      `;

      window.saveAnswer = (id, val) => {
        userAnswers[id] = val;
      };

      const submitAction = () => evaluateAndShowResult(chapterTitle, safeChapterId);
      document.getElementById("top-submit-btn").onclick = submitAction;
      document.getElementById("bottom-submit-btn").onclick = submitAction;
    }

    async function evaluateAndShowResult(chapterTitle, safeChapterId) {
      mainContent.innerHTML = `
        <div class="text-center py-20 space-y-4">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent"></div>
          <h3 class="text-lg font-semibold text-white">AI is Evaluating Your Answer Sheet...</h3>
          <p class="text-xs text-slate-400">Marking according to CBSE step-evaluation criteria.</p>
        </div>
      `;

      try {
        const evalPrompt = `
You are an official CBSE Board Examiner checking a Class 10 student's answers.
Evaluate the student's typed responses and selected options.

Test Data:
${JSON.stringify({ questions: currentQuestions, answers: userAnswers })}

Return STRICTLY raw JSON:
{
  "score": 0,
  "maxScore": ${currentQuestions.length},
  "percentage": 0,
  "summary": "2-3 lines feedback detailing strengths and areas where marks were lost",
  "breakdown": [
    {
      "question": "Question text",
      "type": "type",
      "userAnswer": "Student's answer",
      "correctAnswer": "Ideal answer",
      "isCorrect": true,
      "mistakeComment": "Specific error details or missing keywords if marks were deducted"
    }
  ]
}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: evalPrompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const resData = await response.json();
        let jsonText = resData.candidates[0].content.parts[0].text;
        jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
        const evalData = JSON.parse(jsonText);

        // Update user Firestore document to prevent repetition on subsequent tests
        const newTopics = currentQuestions.map(q => q.topicKeyword || q.question.substring(0, 30));
        const historyRef = doc(db, "users", currentUser.uid, "history", safeChapterId);
        await setDoc(historyRef, { topics: arrayUnion(...newTopics) }, { merge: true });

        renderResultScreen(evalData);

      } catch (err) {
        console.error(err);
        alert("Evaluation failed. Please verify connection and retry.");
        renderSetupScreen();
      }
    }

    function renderResultScreen(res) {
      let breakdownHtml = res.breakdown.map((b) => `
        <div class="p-4 rounded-xl border ${b.isCorrect ? 'bg-emerald-950/20 border-emerald-900/60' : 'bg-red-950/20 border-red-900/60'}">
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="font-semibold ${b.isCorrect ? 'text-emerald-400' : 'text-red-400'}">
              ${b.isCorrect ? '✓ Correct' : '✕ Needs Improvement'}
            </span>
            <span class="text-slate-400">${b.type}</span>
          </div>
          <p class="text-sm text-white font-medium mb-2">${b.question}</p>
          <div class="text-xs space-y-1 text-slate-300">
            <p><span class="text-slate-400">Your Answer:</span> ${b.userAnswer || 'Not Answered'}</p>
            <p><span class="text-slate-400">Model Answer:</span> ${b.correctAnswer}</p>
            ${b.mistakeComment ? `<p class="text-amber-300 mt-1"><span class="font-semibold">Mistake Analysis:</span> ${b.mistakeComment}</p>` : ''}
          </div>
        </div>
      `).join('');

      mainContent.innerHTML = `
        <div class="space-y-6">
          <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 text-center">
            <h2 class="text-4xl font-bold text-cyan-400">${res.score} / ${res.maxScore}</h2>
            <p class="text-sm font-semibold text-white mt-1">Score: ${res.percentage}%</p>
            <p class="text-xs text-slate-300 mt-2 max-w-md mx-auto">${res.summary}</p>
            <button id="practice-more-btn" class="mt-5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow">
              Practice Another Chapter / Next Set
            </button>
          </div>

          <div class="space-y-3">
            <h3 class="text-sm font-bold text-slate-300">Detailed Question Breakdown & Mistakes</h3>
            ${breakdownHtml}
          </div>
        </div>
      `;

      document.getElementById("practice-more-btn").onclick = renderSetupScreen;
    }
  </script>
</body>
</html>
