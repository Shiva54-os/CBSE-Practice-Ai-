<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBSE Class 10 Board Practice Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="app" class="max-w-3xl mx-auto p-4 md:p-6 pb-28">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
      <div>
        <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
          CBSE Board Practice Hub
        </h1>
        <p class="text-xs text-slate-400">Class 10 Smart Mock System • 43-Question Board Pattern</p>
      </div>
      <div id="auth-container"></div>
    </header>

    <!-- Main Dynamic Area -->
    <main id="main-content">
      <div class="text-center py-16">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-cyan-500 border-t-transparent"></div>
        <p class="text-slate-400 text-xs mt-3">Connecting to system...</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAveLxGKaflyzauKoivpxW_XBKFzylgRfs",
      authDomain: "cbse-practice-5c956.firebaseapp.com",
      projectId: "cbse-practice-5c956",
      storageBucket: "cbse-practice-5c956.firebasestorage.app",
      messagingSenderId: "264196286802",
      appId: "1:264196286802:web:e4485efa3e2720559bf28b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentQuestions = [];
    let userAnswers = {};
    let lastChapter = "";
    let lastDifficulty = "";

    const authContainer = document.getElementById("auth-container");
    const mainContent = document.getElementById("main-content");

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      renderAuthButton();
      if (user) {
        // Pre-fetch and cache key in session so it never delays again
        getGeminiKey().catch(console.error);
        renderSetupScreen();
      } else {
        renderLoginPrompt();
      }
    });

    async function getGeminiKey() {
      const cached = sessionStorage.getItem("cached_gemini_key");
      if (cached) return cached;

      const snap = await getDoc(doc(db, "settings", "api"));
      if (snap.exists() && snap.data().geminiKey) {
        const key = snap.data().geminiKey.trim();
        sessionStorage.setItem("cached_gemini_key", key);
        return key;
      }
      throw new Error("Gemini key not found in Firebase Firestore.");
    }

    // High Resilience Auto-Retry with Progressive Delays
    async function callGemini(apiKey, prompt, updateStatus) {
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
      const delays = [2000, 3500, 5000, 6000];
      let lastErrorMessage = "";

      for (let attempt = 1; attempt <= 4; attempt++) {
        try {
          if (updateStatus) {
            updateStatus(attempt === 1 
              ? "Generating CBSE Board Paper (43 Questions)..." 
              : `AI busy, auto-reconnecting... (Attempt ${attempt}/4)`
            );
          }

          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-goog-api-key": apiKey
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { 
                responseMimeType: "application/json",
                temperature: 0.6
              }
            })
          });

          const data = await res.json();
          if (data.candidates && data.candidates[0]) {
            return data;
          }

          if (data.error) {
            lastErrorMessage = data.error.message;
            console.warn(`Attempt ${attempt} rush/error:`, data.error.message);
          }
        } catch (err) {
          lastErrorMessage = err.message;
          console.warn(`Network error on attempt ${attempt}:`, err);
        }

        // Wait before next retry
        await new Promise(r => setTimeout(r, delays[attempt - 1] || 3000));
      }

      throw new Error(lastErrorMessage || "Server is experiencing high traffic. Please retry in a few seconds.");
    }

    function renderAuthButton() {
      if (currentUser) {
        authContainer.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-300 font-medium hidden sm:inline">${currentUser.displayName || 'Student'}</span>
            <button id="logout-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
              Logout
            </button>
          </div>
        `;
        document.getElementById("logout-btn").onclick = () => {
          sessionStorage.removeItem("cached_gemini_key");
          signOut(auth);
        };
      } else {
        authContainer.innerHTML = `
          <button id="login-btn" class="bg-blue-600 hover:bg-blue-500 text-xs font-semibold px-4 py-2 rounded-lg text-white">
            Google Sign-In
          </button>
        `;
        document.getElementById("login-btn").onclick = () => signInWithPopup(auth, provider);
      }
    }

    function renderLoginPrompt() {
      mainContent.innerHTML = `
        <div class="bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl text-center my-12 backdrop-blur">
          <h2 class="text-2xl font-bold mb-3 text-white">Target 95%+ in Class 10 Boards</h2>
          <p class="text-slate-400 text-sm max-w-md mx-auto mb-6">
            Practice full-length 43-question CBSE board papers (MCQs, Assertion-Reason, VSA, Short & Long Answers) with AI step evaluation.
          </p>
          <button id="hero-login-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-blue-500/20">
            Sign In with Google to Start Practice
          </button>
        </div>
      `;
      document.getElementById("hero-login-btn").onclick = () => signInWithPopup(auth, provider);
    }

    function renderSetupScreen() {
      mainContent.innerHTML = `
        <div class="bg-slate-800/40 border border-slate-700/80 p-6 rounded-2xl space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">Subject / Chapter Name</label>
            <input id="chapter-input" type="text" value="${lastChapter}" placeholder="e.g. Science: Chemical Reactions and Equations" 
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">Paper Difficulty</label>
            <select id="difficulty-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
              <option value="Standard CBSE Board Pattern (PYQs + Competency)">Standard Board Pattern (PYQ + Competency)</option>
              <option value="Fundamental & Concept Clarity">Fundamental & Basic Concepts</option>
              <option value="Tough / High Order Thinking (HOTS)">High Order Thinking (HOTS) & Critical Analysis</option>
            </select>
          </div>

          <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-xs text-slate-400 space-y-1">
            <p class="font-semibold text-slate-300">📄 Paper Composition (43 Total Questions):</p>
            <p>• Section A: 15 MCQs (1 Mark)</p>
            <p>• Section B: 5 Assertion-Reason (1 Mark)</p>
            <p>• Section C: 10 Very Short Answers - VSA (2 Marks)</p>
            <p>• Section D: 8 Short Answers - SA (3 Marks)</p>
            <p>• Section E: 5 Long Answers - LA (5 Marks)</p>
          </div>

          <button id="start-btn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/10">
            Generate Full Board Paper
          </button>
        </div>
      `;

      if (lastDifficulty) {
        document.getElementById("difficulty-input").value = lastDifficulty;
      }

      document.getElementById("start-btn").onclick = () => {
        const ch = document.getElementById("chapter-input").value.trim();
        const diff = document.getElementById("difficulty-input").value;
        if (!ch) {
          alert("Please enter a chapter name");
          return;
        }
        lastChapter = ch;
        lastDifficulty = diff;
        triggerPaperGeneration(ch, diff);
      };
    }

    async function triggerPaperGeneration(chapter, difficulty) {
      mainContent.innerHTML = `
        <div class="text-center py-20 space-y-4">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-cyan-500 border-t-transparent"></div>
          <h3 id="loader-title" class="text-lg font-semibold text-white">Generating CBSE Board Paper (43 Questions)...</h3>
          <p id="loader-sub" class="text-xs text-slate-400">Verifying non-repetition database...</p>
        </div>
      `;

      const updateStatus = (text) => {
        const t = document.getElementById("loader-title");
        if (t) t.innerText = text;
      };

      try {
        const apiKey = await getGeminiKey();
        const safeChapterId = chapter.toLowerCase().replace(/[^a-z0-9]/g, "_");
        const historyRef = doc(db, "users", currentUser.uid, "history", safeChapterId);
        const historySnap = await getDoc(historyRef);
        const excludedTopics = historySnap.exists() ? historySnap.data().topics || [] : [];

        // Highly optimized prompt to prevent token bloating / high-demand 503
        const prompt = `
Create a CBSE Class 10 Board Exam Paper for Chapter: "${chapter}".
Level: ${difficulty}.
DO NOT repeat: ${JSON.stringify(excludedTopics.slice(-30))}.

Generate EXACTLY 43 questions:
- 15 MCQs (type: "MCQ") with 4 options each.
- 5 Assertion-Reason (type: "ASSERTION_REASON") with 4 standard options.
- 10 Very Short Answer (type: "VSA", 2 marks).
- 8 Short Answer (type: "SA", 3 marks).
- 5 Long Answer (type: "LA", 5 marks).

Return raw JSON only (no markdown backticks, keep answers concise key points):
{
  "title": "${chapter}",
  "questions": [
    {
      "id": 1,
      "section": "Section A: Multiple Choice Questions (15 Marks)",
      "type": "MCQ",
      "question": "Question text",
      "options": ["A", "B", "C", "D"],
      "correctAnswer": "Exact option text",
      "topicKeyword": "topic"
    },
    {
      "id": 16,
      "section": "Section B: Assertion and Reason (5 Marks)",
      "type": "ASSERTION_REASON",
      "question": "Assertion (A): ... \\nReason (R): ...",
      "options": [
        "Both A and R are true and R is correct explanation of A",
        "Both A and R are true but R is NOT correct explanation of A",
        "A is true but R is false",
        "A is false but R is true"
      ],
      "correctAnswer": "Both A and R are true and R is correct explanation of A",
      "topicKeyword": "topic"
    },
    {
      "id": 21,
      "section": "Section C: Very Short Answer Questions (20 Marks)",
      "type": "VSA",
      "question": "Question text",
      "options": null,
      "correctAnswer": "Expected 2 points",
      "topicKeyword": "topic"
    },
    {
      "id": 31,
      "section": "Section D: Short Answer Questions (24 Marks)",
      "type": "SA",
      "question": "Question text",
      "options": null,
      "correctAnswer": "Expected 3 key points",
      "topicKeyword": "topic"
    },
    {
      "id": 39,
      "section": "Section E: Long Answer Questions (25 Marks)",
      "type": "LA",
      "question": "Question text",
      "options": null,
      "correctAnswer": "Key criteria points",
      "topicKeyword": "topic"
    }
  ]
}
`;

        const resData = await callGemini(apiKey, prompt, updateStatus);
        let jsonText = resData.candidates[0].content.parts[0].text;
        jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(jsonText);

        currentQuestions = parsed.questions;
        userAnswers = {};
        renderTestScreen(chapter, safeChapterId);

      } catch (err) {
        console.error(err);
        mainContent.innerHTML = `
          <div class="bg-red-950/40 border border-red-800 p-6 rounded-2xl text-center space-y-4">
            <p class="text-red-400 text-sm font-medium">Failed to generate paper: ${err.message}</p>
            <div class="flex justify-center gap-3">
              <button id="instant-retry-btn" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl text-xs font-semibold text-white shadow">
                Retry Now (Fast)
              </button>
              <button id="back-home-btn" class="bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl text-xs text-slate-300">
                Change Chapter
              </button>
            </div>
          </div>
        `;

        document.getElementById("instant-retry-btn").onclick = () => triggerPaperGeneration(chapter, difficulty);
        document.getElementById("back-home-btn").onclick = renderSetupScreen;
      }
    }

    function renderTestScreen(chapterTitle, safeChapterId) {
      let currentSection = "";
      let html = "";

      currentQuestions.forEach((q, idx) => {
        if (q.section && q.section !== currentSection) {
          currentSection = q.section;
          html += `
            <div class="pt-6 pb-2 border-b border-slate-700/80 mb-3">
              <h3 class="text-sm md:text-base font-bold text-cyan-400 uppercase tracking-wide">${currentSection}</h3>
            </div>
          `;
        }

        let inputArea = '';
        if (q.options && q.options.length > 0) {
          inputArea = `
            <div class="space-y-2 mt-3">
              ${q.options.map((opt) => `
                <label class="flex items-center gap-3 p-3 bg-slate-900/70 rounded-xl border border-slate-700/60 hover:border-slate-500 cursor-pointer transition">
                  <input type="radio" name="q_${q.id}" value="${opt}" onchange="window.saveAnswer(${q.id}, '${opt.replace(/'/g, "\\'")}')" class="text-cyan-500" />
                  <span class="text-sm text-slate-200">${opt}</span>
                </label>
              `).join('')}
            </div>
          `;
        } else {
          const height = q.type === 'LA' ? 'min-h-[140px]' : q.type === 'SA' ? 'min-h-[100px]' : 'min-h-[70px]';
          inputArea = `
            <div class="mt-3">
              <textarea placeholder="Type your answer here..." oninput="window.saveAnswer(${q.id}, this.value)"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500 ${height}"></textarea>
            </div>
          `;
        }

        html += `
          <div class="bg-slate-800/40 border border-slate-700/60 p-5 rounded-2xl mb-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-700 text-cyan-400">${q.type}</span>
              <span class="text-xs text-slate-400 font-mono">Q${idx + 1} / ${currentQuestions.length}</span>
            </div>
            <p class="text-white text-sm font-medium mt-1 leading-relaxed whitespace-pre-line">${q.question}</p>
            ${inputArea}
          </div>
        `;
      });

      mainContent.innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-slate-800/90 p-4 rounded-xl border border-slate-700 sticky top-2 backdrop-blur z-20 shadow-md">
            <div>
              <h2 class="text-xs md:text-sm font-bold text-white truncate max-w-[200px] sm:max-w-none">${chapterTitle}</h2>
              <p id="progress-indicator" class="text-xs text-cyan-400 font-medium">0 / ${currentQuestions.length} Answered</p>
            </div>
            <button id="top-submit-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow">
              Submit Paper
            </button>
          </div>

          <div>
            ${html}
          </div>

          <button id="bottom-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg">
            Submit Complete Paper & Evaluate
          </button>
        </div>
      `;

      window.saveAnswer = (id, val) => {
        userAnswers[id] = val;
        const count = Object.values(userAnswers).filter(v => v && v.trim && v.trim().length > 0).length;
        const ind = document.getElementById("progress-indicator");
        if (ind) ind.innerText = `${count} / ${currentQuestions.length} Answered`;
      };

      const submitAction = () => evaluateAndShowResult(chapterTitle, safeChapterId);
      document.getElementById("top-submit-btn").onclick = submitAction;
      document.getElementById("bottom-submit-btn").onclick = submitAction;
    }

    async function evaluateAndShowResult(chapterTitle, safeChapterId) {
      mainContent.innerHTML = `
        <div class="text-center py-20 space-y-4">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent"></div>
          <h3 id="eval-title" class="text-lg font-semibold text-white">AI Examiner Evaluating Answers...</h3>
          <p class="text-xs text-slate-400">Step-by-step scoring as per official CBSE Class 10 criteria.</p>
        </div>
      `;

      try {
        const apiKey = await getGeminiKey();

        // 1. Instant MCQ & Assertion-Reason evaluation locally
        let breakdown = [];
        let score = 0;
        let subjectiveQuestions = [];

        currentQuestions.forEach(q => {
          const userAns = (userAnswers[q.id] || "").trim();
          if (q.type === 'MCQ' || q.type === 'ASSERTION_REASON') {
            const isCorrect = userAns.toLowerCase() === (q.correctAnswer || "").trim().toLowerCase();
            if (isCorrect) score += 1;
            breakdown.push({
              id: q.id,
              question: q.question,
              type: q.type,
              userAnswer: userAns || "Not Answered",
              correctAnswer: q.correctAnswer,
              isCorrect: isCorrect,
              mistakeComment: isCorrect ? "Correct answer selected." : "Incorrect option choice."
            });
          } else {
            subjectiveQuestions.push({
              id: q.id,
              type: q.type,
              question: q.question,
              userAnswer: userAns,
              correctAnswer: q.correctAnswer
            });
          }
        });

        // 2. AI grading for written subjective answers
        const evalPrompt = `
Evaluate these student answers as a CBSE Board Examiner:
${JSON.stringify(subjectiveQuestions)}

Return raw JSON only:
{
  "summary": "Brief 2-sentence feedback",
  "evaluations": [
    {
      "id": 2
